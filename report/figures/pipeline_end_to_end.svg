<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#37474f"/>
    </marker>
    <marker id="arrowLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/>
    </marker>
    <marker id="arrowEvt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6a1b9a"/>
    </marker>
    <style>
      .box   { stroke-width: 1.6; rx: 8; }
      .lbl   { font-size: 14px; fill: #102027; font-weight: 600; }
      .sub   { font-size: 11.5px; fill: #46606d; }
      .mod   { font-size: 11px; fill: #78909c; font-style: italic; }
      .edge  { stroke: #37474f; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .loop  { stroke: #2e7d32; stroke-width: 2; fill: none; marker-end: url(#arrowLoop); stroke-dasharray: 7 4; }
      .looplbl { font-size: 12px; fill: #2e7d32; font-weight: 600; }
      .evt   { stroke: #6a1b9a; stroke-width: 1.6; fill: none; marker-end: url(#arrowEvt); stroke-dasharray: 3 3; }
      .evtlbl { font-size: 12px; fill: #6a1b9a; font-weight: 600; }
      .title { font-size: 17px; fill: #102027; font-weight: 700; }
      .phase { font-size: 12.5px; fill: #607d8b; font-weight: 700; letter-spacing: 0.08em; }
    </style>
  </defs>

  <rect width="1240" height="700" fill="#ffffff"/>
  <text x="32" y="40" class="title">End-to-end pipeline: one command from photo to painting</text>
  <text x="32" y="60" class="sub">scripts/run_paint.py and pipeline/progressive_painter.paint_image. Module files in italics. The dashed green loop runs once per grid level; dotted purple arrows are progress events.</text>

  <!-- input -->
  <text x="32" y="100" class="phase">1 &#183; INPUT</text>
  <rect class="box" x="32" y="112" width="190" height="78" fill="#eceff1" stroke="#90a4ae"/>
  <text x="127" y="140" class="lbl" text-anchor="middle">Photo, any size</text>
  <text x="127" y="158" class="sub" text-anchor="middle">JPG / PNG / ..., EXIF rotation</text>
  <text x="127" y="178" class="mod" text-anchor="middle">core/image_io.load_image</text>

  <rect class="box" x="262" y="112" width="210" height="78" fill="#e3f2fd" stroke="#64b5f6"/>
  <text x="367" y="136" class="lbl" text-anchor="middle">Fit to a square</text>
  <text x="367" y="154" class="sub" text-anchor="middle">stretch (original) / crop / pad,</text>
  <text x="367" y="169" class="sub" text-anchor="middle">512 x 512 RGB in [0, 1]</text>
  <text x="367" y="184" class="mod" text-anchor="middle">core/image_io.preprocess</text>
  <path class="edge" d="M222 151 L258 151"/>

  <rect class="box" x="512" y="112" width="250" height="78" fill="#e3f2fd" stroke="#64b5f6"/>
  <text x="637" y="136" class="lbl" text-anchor="middle">Grid levels and budgets</text>
  <text x="637" y="154" class="sub" text-anchor="middle">progressive 1, 2, ..., M; fixed M; full 1</text>
  <text x="637" y="169" class="sub" text-anchor="middle">strokes per level: equal split or exact</text>
  <text x="637" y="184" class="mod" text-anchor="middle">core/grid.grid_levels, level_budgets</text>
  <path class="edge" d="M472 151 L508 151"/>

  <!-- level loop -->
  <text x="182" y="240" class="phase">2 &#183; ONE GRID LEVEL m (REPEATED FOR EVERY LEVEL)</text>
  <rect x="32" y="248" width="1176" height="250" rx="12" fill="#fafafa" stroke="#cfd8dc" stroke-dasharray="4 4"/>

  <rect class="box" x="52" y="270" width="214" height="96" fill="#fff8e1" stroke="#ffb300"/>
  <text x="159" y="294" class="lbl" text-anchor="middle">Cut into m x m blocks</text>
  <text x="159" y="312" class="sub" text-anchor="middle">target and current canvas, each</text>
  <text x="159" y="327" class="sub" text-anchor="middle">shrunk to m S pixels (S = 32 or 128)</text>
  <text x="159" y="356" class="mod" text-anchor="middle">core/grid.img2patches</text>
  <path class="edge" d="M637 190 L637 220 L159 220 L159 266"/>

  <rect class="box" x="300" y="270" width="214" height="96" fill="#fff8e1" stroke="#ffb300"/>
  <text x="407" y="294" class="lbl" text-anchor="middle">Strokes per block</text>
  <text x="407" y="312" class="sub" text-anchor="middle">equal (original), or in proportion</text>
  <text x="407" y="327" class="sub" text-anchor="middle">to the block's error (D'Hondt, capped)</text>
  <text x="407" y="356" class="mod" text-anchor="middle">progressive_painter.allocate</text>
  <path class="edge" d="M266 318 L296 318"/>

  <rect class="box" x="548" y="262" width="330" height="214" fill="#fce4ec" stroke="#ec407a"/>
  <text x="713" y="286" class="lbl" text-anchor="middle">Optimize the strokes of all blocks</text>
  <text x="713" y="304" class="mod" text-anchor="middle">pipeline/painter_engine.PainterEngine.paint</text>
  <text x="566" y="330" class="sub">for each new stroke k (the anchor), in every block at once:</text>
  <text x="580" y="350" class="sub">1. start it from the error map of the canvas</text>
  <text x="580" y="368" class="sub">2. T optimizer steps on strokes 0..k:</text>
  <text x="596" y="386" class="sub">neural renderer -&gt; dilate / erode -&gt; composite</text>
  <text x="596" y="404" class="sub">-&gt; pixel loss (+ optional Sinkhorn) -&gt; backward</text>
  <text x="596" y="422" class="sub">-&gt; RMSprop step (constant or cosine lr)</text>
  <text x="566" y="446" class="sub">unused slots of a block stay transparent (opacity x 0)</text>
  <text x="566" y="464" class="mod">models/neural_renderer.py, pipeline/stroke_sampler.py</text>
  <path class="edge" d="M514 318 L544 318"/>

  <rect class="box" x="912" y="270" width="276" height="96" fill="#e8f5e9" stroke="#66bb6a"/>
  <text x="1050" y="294" class="lbl" text-anchor="middle">Block to image coordinates</text>
  <text x="1050" y="312" class="sub" text-anchor="middle">x -&gt; (col + x) / m, sizes / m; stroke j</text>
  <text x="1050" y="327" class="sub" text-anchor="middle">of every block before stroke j + 1</text>
  <text x="1050" y="356" class="mod" text-anchor="middle">core/grid.block_to_global, flatten_blocks</text>
  <path class="edge" d="M878 318 L908 318"/>

  <rect class="box" x="912" y="388" width="276" height="88" fill="#e8f5e9" stroke="#66bb6a"/>
  <text x="1050" y="412" class="lbl" text-anchor="middle">Rasterize onto the painting</text>
  <text x="1050" y="430" class="sub" text-anchor="middle">real brush textures at 512 px, drawn</text>
  <text x="1050" y="445" class="sub" text-anchor="middle">on top of the previous levels' strokes</text>
  <text x="1050" y="466" class="mod" text-anchor="middle">core/procedural_rasterizer.py</text>
  <path class="edge" d="M1050 366 L1050 384"/>

  <path class="loop" d="M912 440 L895 440 L895 486 L280 486 L280 400 L159 400 L159 370"/>
  <text x="300" y="478" class="looplbl">canvas handed to the next level (m + 1)</text>

  <!-- outputs -->
  <text x="32" y="544" class="phase">3 &#183; OUTPUT</text>
  <rect class="box" x="912" y="556" width="276" height="96" fill="#ede7f6" stroke="#7e57c2"/>
  <text x="1050" y="580" class="lbl" text-anchor="middle">Painting and records</text>
  <text x="1050" y="598" class="sub" text-anchor="middle">final.png (photo's aspect ratio), input.png,</text>
  <text x="1050" y="613" class="sub" text-anchor="middle">strokes.npz, config.yaml, results.csv</text>
  <text x="1050" y="640" class="mod" text-anchor="middle">scripts/run_paint.py</text>
  <path class="edge" d="M1050 476 L1050 552"/>

  <rect class="box" x="548" y="556" width="330" height="96" fill="#f3e5f5" stroke="#ab47bc"/>
  <text x="713" y="580" class="lbl" text-anchor="middle">Progress events</text>
  <text x="713" y="598" class="sub" text-anchor="middle">level, strokes done / total, loss, PSNR,</text>
  <text x="713" y="613" class="sub" text-anchor="middle">elapsed time, neural canvas for a preview</text>
  <text x="713" y="640" class="mod" text-anchor="middle">progressive_painter.Progress -&gt; status line, web UI</text>
  <path class="evt" d="M713 476 L713 552"/>

  <rect class="box" x="52" y="556" width="440" height="96" fill="#eceff1" stroke="#90a4ae"/>
  <text x="272" y="580" class="lbl" text-anchor="middle">Measured on every run</text>
  <text x="272" y="598" class="sub" text-anchor="middle">PSNR / SSIM / LPIPS against the fitted photo, optimize and</text>
  <text x="272" y="613" class="sub" text-anchor="middle">rasterize time, optimizer steps, peak working memory</text>
  <text x="272" y="640" class="mod" text-anchor="middle">pipeline/metrics.py, core/device.PeakMemory</text>
</svg>
