<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#37474f"/>
    </marker>
    <marker id="arrowGrad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/>
    </marker>
    <style>
      .box   { stroke-width: 1.6; rx: 8; }
      .lbl   { font-size: 14px; fill: #102027; font-weight: 600; }
      .sub   { font-size: 11.5px; fill: #46606d; }
      .mod   { font-size: 11px; fill: #78909c; font-style: italic; }
      .edge  { stroke: #37474f; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .grad  { stroke: #c62828; stroke-width: 2; fill: none; marker-end: url(#arrowGrad); stroke-dasharray: 7 4; }
      .gradlbl { font-size: 12px; fill: #c62828; font-weight: 600; }
      .title { font-size: 17px; fill: #102027; font-weight: 700; }
      .phase { font-size: 12.5px; fill: #607d8b; font-weight: 700; letter-spacing: 0.08em; }
      .eq    { font-size: 13px; fill: #1b3a4b; font-weight: 600; }
    </style>
  </defs>

  <rect width="1240" height="820" fill="#ffffff"/>
  <text x="32" y="40" class="title">Neural painter: system architecture and data flow</text>
  <text x="32" y="60" class="sub">Module files in italics. Solid arrows carry data, dashed red arrows carry gradients. &#8857; is the element-wise product.</text>

  <!-- ============ stage 1 ============ -->
  <text x="32" y="98" class="phase">1 &#183; INPUT AND PREPROCESSING</text>
  <rect class="box" x="32" y="110" width="176" height="72" fill="#eceff1" stroke="#90a4ae"/>
  <text x="120" y="137" class="lbl" text-anchor="middle">Photo (JPG / PNG)</text>
  <text x="120" y="156" class="sub" text-anchor="middle">upload or sample picker</text>
  <text x="120" y="172" class="mod" text-anchor="middle">app/gradio_app.py</text>

  <rect class="box" x="248" y="110" width="186" height="72" fill="#e3f2fd" stroke="#64b5f6"/>
  <text x="341" y="132" class="lbl" text-anchor="middle">Preprocess</text>
  <text x="341" y="150" class="sub" text-anchor="middle">crop / resize / normalize</text>
  <text x="341" y="165" class="sub" text-anchor="middle">(1, 3, S, S) in [0, 1]</text>
  <text x="341" y="179" class="mod" text-anchor="middle">core/image_io.py</text>

  <rect class="box" x="474" y="110" width="186" height="72" fill="#e3f2fd" stroke="#64b5f6"/>
  <text x="567" y="132" class="lbl" text-anchor="middle">Grid split</text>
  <text x="567" y="150" class="sub" text-anchor="middle">m &#215; m blocks, row-major</text>
  <text x="567" y="165" class="sub" text-anchor="middle">target patches I</text>
  <text x="567" y="179" class="mod" text-anchor="middle">core/grid.py</text>

  <line class="edge" x1="208" y1="146" x2="242" y2="146"/>
  <line class="edge" x1="434" y1="146" x2="468" y2="146"/>

  <!-- ============ stage 2 ============ -->
  <text x="32" y="232" class="phase">2 &#183; STROKE OPTIMIZATION LOOP &#183; one pass per stroke, for every block of the current grid level</text>
  <rect x="32" y="244" width="924" height="356" rx="14" fill="#fafafa" stroke="#b0bec5" stroke-dasharray="6 5"/>

  <rect class="box" x="84" y="284" width="176" height="80" fill="#fff8e1" stroke="#ffb300"/>
  <text x="172" y="308" class="lbl" text-anchor="middle">Error map</text>
  <text x="172" y="327" class="eq" text-anchor="middle">E = &#931; |I &#8722; C|</text>
  <text x="172" y="343" class="sub" text-anchor="middle">blur W/8, power 4, normalize</text>
  <text x="172" y="358" class="mod" text-anchor="middle">pipeline/stroke_sampler.py</text>

  <rect class="box" x="296" y="284" width="176" height="80" fill="#fff8e1" stroke="#ffb300"/>
  <text x="384" y="308" class="lbl" text-anchor="middle">Stroke sampler</text>
  <text x="384" y="327" class="sub" text-anchor="middle">position drawn from E,</text>
  <text x="384" y="342" class="sub" text-anchor="middle">colour read from the target</text>
  <text x="384" y="358" class="mod" text-anchor="middle">pipeline/stroke_sampler.py</text>

  <rect class="box" x="508" y="284" width="176" height="80" fill="#f3e5f5" stroke="#ab47bc"/>
  <text x="596" y="306" class="lbl" text-anchor="middle">Stroke parameters &#952;</text>
  <text x="596" y="325" class="sub" text-anchor="middle">shape | colour | alpha</text>
  <text x="596" y="340" class="sub" text-anchor="middle">d = 9 / 12 / 15, all in [0, 1]</text>
  <text x="596" y="358" class="mod" text-anchor="middle">core/stroke_models.py</text>

  <rect class="box" x="720" y="284" width="192" height="80" fill="#e8f5e9" stroke="#43a047"/>
  <text x="816" y="306" class="lbl" text-anchor="middle">Neural renderer G&#966;</text>
  <text x="816" y="325" class="sub" text-anchor="middle">differentiable surrogate</text>
  <text x="816" y="342" class="eq" text-anchor="middle">&#952; &#8594; (F&#770;, A&#770;)</text>
  <text x="816" y="358" class="mod" text-anchor="middle">models/neural_renderer.py</text>

  <rect class="box" x="84" y="452" width="284" height="80" fill="#ffebee" stroke="#e53935"/>
  <text x="226" y="475" class="lbl" text-anchor="middle">Optimizer step on &#952;</text>
  <text x="226" y="494" class="sub" text-anchor="middle">RMSprop / Adam, then clamp:</text>
  <text x="226" y="509" class="sub" text-anchor="middle">shape to [0.1, 0.9], colour and alpha to [0, 1]</text>
  <text x="226" y="525" class="mod" text-anchor="middle">pipeline/painter_engine.py</text>

  <rect class="box" x="404" y="452" width="284" height="80" fill="#ffebee" stroke="#e53935"/>
  <text x="546" y="474" class="lbl" text-anchor="middle">Loss: canvas against target patches I</text>
  <text x="546" y="494" class="eq" text-anchor="middle">L = &#946;&#8321; L(pixel) + &#946;&#8322; L(sinkhorn)</text>
  <text x="546" y="510" class="sub" text-anchor="middle">pixel term + optimal-transport term</text>
  <text x="546" y="525" class="mod" text-anchor="middle">losses/pixel_loss.py, losses/sinkhorn.py</text>

  <rect class="box" x="720" y="452" width="192" height="80" fill="#e8f5e9" stroke="#43a047"/>
  <text x="816" y="474" class="lbl" text-anchor="middle">Differentiable canvas</text>
  <text x="816" y="495" class="eq" text-anchor="middle">C&#8342; = A&#770; &#8857; F&#770; + (1 &#8722; A&#770;) &#8857; C&#8342;&#8331;&#8321;</text>
  <text x="816" y="511" class="sub" text-anchor="middle">dilate F&#770;, erode A&#770;</text>
  <text x="816" y="526" class="mod" text-anchor="middle">core/differentiable_canvas.py</text>

  <!-- forward edges -->
  <line class="edge" x1="260" y1="324" x2="290" y2="324"/>
  <line class="edge" x1="472" y1="324" x2="502" y2="324"/>
  <line class="edge" x1="684" y1="324" x2="714" y2="324"/>
  <line class="edge" x1="816" y1="364" x2="816" y2="446"/>
  <text x="826" y="410" class="sub">stroke (F&#770;, A&#770;)</text>
  <line class="edge" x1="720" y1="492" x2="694" y2="492"/>

  <!-- gradient path -->
  <line class="grad" x1="404" y1="492" x2="374" y2="492"/>
  <path class="grad" d="M 226 452 L 226 392 L 596 392 L 596 370"/>
  <text x="248" y="418" class="gradlbl">&#8706;L/&#8706;&#952; &#183; backpropagation through G&#966; and the compositing equation updates the stroke parameters</text>

  <!-- target into the error map -->
  <path class="edge" d="M 500 182 L 500 204 L 48 204 L 48 300 L 78 300" fill="none"/>
  <text x="62" y="272" class="sub">target patches I</text>

  <!-- canvas feedback -->
  <path class="edge" d="M 816 532 L 816 578 L 48 578 L 48 348 L 78 348" fill="none"/>
  <text x="430" y="571" class="sub" text-anchor="middle">current canvas: the next stroke is placed where the error is still large</text>

  <!-- ============ stage 3 ============ -->
  <text x="990" y="98" class="phase">3 &#183; OUTPUT</text>
  <rect class="box" x="990" y="110" width="218" height="80" fill="#ede7f6" stroke="#7e57c2"/>
  <text x="1099" y="134" class="lbl" text-anchor="middle">Procedural rasterizer</text>
  <text x="1099" y="152" class="sub" text-anchor="middle">OpenCV, not differentiable</text>
  <text x="1099" y="167" class="sub" text-anchor="middle">final high-resolution render</text>
  <text x="1099" y="183" class="mod" text-anchor="middle">core/procedural_rasterizer.py</text>

  <rect class="box" x="990" y="616" width="218" height="72" fill="#ede7f6" stroke="#7e57c2"/>
  <text x="1099" y="642" class="lbl" text-anchor="middle">Painting PNG / JPG</text>
  <text x="1099" y="660" class="sub" text-anchor="middle">+ stroke parameters .npz</text>
  <text x="1099" y="676" class="mod" text-anchor="middle">export/</text>

  <rect class="box" x="990" y="712" width="218" height="72" fill="#ede7f6" stroke="#7e57c2"/>
  <text x="1099" y="738" class="lbl" text-anchor="middle">Time-lapse MP4 / GIF</text>
  <text x="1099" y="756" class="sub" text-anchor="middle">one frame per stroke</text>
  <text x="1099" y="772" class="mod" text-anchor="middle">export/video_recorder.py</text>

  <path class="edge" d="M 956 492 L 976 492 L 976 150 L 984 150" fill="none"/>
  <text x="966" y="300" class="sub" transform="rotate(-90 966 300)" text-anchor="middle">optimized &#952;</text>
  <line class="edge" x1="1099" y1="190" x2="1099" y2="610"/>
  <line class="edge" x1="1099" y1="688" x2="1099" y2="706"/>

  <!-- ============ progressive band ============ -->
  <rect x="32" y="616" width="924" height="76" rx="12" fill="#e0f7fa" stroke="#26c6da"/>
  <text x="56" y="643" class="lbl">Progressive coarse-to-fine loop</text>
  <text x="56" y="663" class="sub">m = 1 &#8594; 2 &#8594; ... &#8594; M. Each level re-splits the image, starts from the previous canvas, and maps block coordinates to</text>
  <text x="56" y="679" class="sub">global ones (x &#8594; c/m + x/m, sizes &#8594; size/m). The stroke budget is shared equally over all blocks of all levels.</text>
  <text x="836" y="655" class="mod" text-anchor="middle">pipeline/</text>
  <text x="836" y="670" class="mod" text-anchor="middle">progressive_painter.py</text>
  <line class="edge" x1="494" y1="600" x2="494" y2="610"/>

  <!-- ============ UI band ============ -->
  <rect x="32" y="712" width="924" height="76" rx="12" fill="#eceff1" stroke="#90a4ae"/>
  <text x="56" y="739" class="lbl">Gradio web interface</text>
  <text x="56" y="759" class="sub">brush selector &#183; stroke-count slider &#183; grid mode &#183; canvas colour &#183; live progress bar and canvas preview</text>
  <text x="56" y="775" class="sub">before / after comparison &#183; stroke-by-stroke playback &#183; download buttons</text>
  <text x="836" y="757" class="mod" text-anchor="middle">app/gradio_app.py</text>
  <line class="edge" x1="494" y1="692" x2="494" y2="706"/>
</svg>
