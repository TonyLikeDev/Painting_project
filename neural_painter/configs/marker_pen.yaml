# Marker pen. Matches renderer 'markerpen' in the original repository.
name: markerpen
display_name: Marker pen
description: >
  Quadratic Bezier stroke from (x0, y0) to (x2, y2) with the control point stored
  relative to the chord. The pen is a square of half width radius0 aligned with the
  curve tangent (radius2 is carried but unused by the rasterizer). Single colour
  (r, g, b) and an explicit opacity alpha.
param_names: [x0, y0, x1, y1, x2, y2, radius0, radius2, r, g, b, alpha]
shape_dim: 8
color_dim: 3
alpha_dim: 1
layout:
  x_params: [x0, x2]
  y_params: [y0, y2]
  size_params: [radius0, radius2]
default_canvas_color: black
renderer:
  checkpoint_full: checkpoints_G_markerpen
  checkpoint_light: checkpoints_G_markerpen_light
  net_full: zou-fusion-net
  net_light: zou-fusion-net-light
  alpha_forced_to_one: false
  out_size_full: 128
  out_size_light: 32
sampler:
  size_range: [0.1, 0.25]
  alpha_range: [0.8, 0.98]
defaults:
  max_strokes: 500
  max_divide: 5
  lr: 0.002
