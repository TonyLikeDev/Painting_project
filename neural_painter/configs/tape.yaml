# Coloured tape / 8-bit rectangle. Matches renderer 'rectangle' in the original repository.
name: rectangle
display_name: Coloured tape
description: >
  Solid-colour rectangle centred at (xc, yc) with half extents derived from (w, h),
  rotated by theta. Single colour (r, g, b) and an explicit opacity alpha.
param_names: [xc, yc, w, h, theta, r, g, b, alpha]
shape_dim: 5
color_dim: 3
alpha_dim: 1
layout:
  x_params: [xc]
  y_params: [yc]
  size_params: [w, h]
default_canvas_color: black
renderer:
  checkpoint_full: checkpoints_G_rectangle
  checkpoint_light: checkpoints_G_rectangle_light
  net_full: zou-fusion-net
  net_light: zou-fusion-net-light
  alpha_forced_to_one: false
  out_size_full: 128
  out_size_light: 32
sampler:
  size_range: [0.1, 0.25]
  theta_range: [0.0, 0.0]
  alpha_range: [0.8, 0.98]
defaults:
  max_strokes: 500
  max_divide: 5
  lr: 0.002
